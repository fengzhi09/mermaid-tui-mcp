<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{TITLE}} · Mermaid {{ID}}</title>
  <link rel="stylesheet" href="/themes/main.css">
</head>
<body>
  <div class="topbar">
    <span class="id">{{ID}}</span>
    <h1 class="diagram-title" id="diagram-title">{{TITLE}}</h1>
    <span class="meta">created {{CREATED_AT}}</span>
    <span class="meta">{{SOURCE_LENGTH}} chars</span>
    <span id="pin-badge"></span>
    <span class="spacer"></span>
    <div class="theme-switcher" id="theme-switcher">
      <button class="theme-btn" data-theme="light" title="Light" data-active="true">☀</button>
      <button class="theme-btn" data-theme="dark" title="Dark">🌙</button>
      <button class="theme-btn" data-theme="warm" title="Warm">☕</button>
      <button class="theme-btn" data-theme="care" title="Care">🌿</button>
    </div>
    <button id="pin-btn" data-show-when="with-pin">pin</button>
    <button id="zoom-out">−</button>
    <button id="zoom-reset">⊕</button>
    <button id="zoom-in">+</button>
    <button id="copy-link">copy link</button>
    <button id="download-svg">SVG</button>
    <button id="download-png">PNG</button>
  </div>
  <div class="meta-line">drag to pan, scroll to zoom, double-click to reset</div>
  <div class="stage-wrap">
    <div class="stage pannable" id="stage">
      <svg id="mermaid-svg" xmlns="http://www.w3.org/2000/svg" viewBox="{{SVG_VIEWBOX}}">{{SVG_BODY}}</svg>
    </div>
  </div>
  <pre class="ascii-block" id="ascii" aria-label="ASCII rendering">{{ASCII}}</pre>
  <pre class="code-block" id="code">{{CODE}}</pre>

  <div class="zoom-controls">
    <button id="z-in" title="zoom in">+</button>
    <button id="z-out" title="zoom out">−</button>
    <button id="z-reset" title="reset">⊕</button>
  </div>

  <script>
    const ID = {{ID_JSON}};
    const TITLE = {{TITLE_JSON}};
    document.title = TITLE ? `${TITLE} · Mermaid ${ID}` : `Mermaid ${ID}`;
    const svg = document.getElementById('mermaid-svg');
    const stage = document.getElementById('stage');
    const pinBtn = document.getElementById('pin-btn');
    const pinBadge = document.getElementById('pin-badge');

    // ---- zoom & pan ----
    let scale = 1, panX = 0, panY = 0;
    let panning = false, panStartX = 0, panStartY = 0;

    function applyTransform() {
      svg.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
    }
    function zoomBy(factor, cx, cy) {
      const next = Math.max(0.2, Math.min(8, scale * factor));
      if (next === scale) return;
      if (cx !== undefined && cy !== undefined) {
        const rect = stage.getBoundingClientRect();
        const ox = cx - rect.left - rect.width / 2 - panX;
        const oy = cy - rect.top - rect.height / 2 - panY;
        panX -= ox * (next / scale - 1);
        panY -= oy * (next / scale - 1);
      }
      scale = next;
      applyTransform();
    }
    function reset() { scale = 1; panX = 0; panY = 0; applyTransform(); }

    document.getElementById('zoom-in').onclick = () => zoomBy(1.25);
    document.getElementById('zoom-out').onclick = () => zoomBy(0.8);
    document.getElementById('z-in').onclick = () => zoomBy(1.25);
    document.getElementById('z-out').onclick = () => zoomBy(0.8);
    document.getElementById('zoom-reset').onclick = reset;
    document.getElementById('z-reset').onclick = reset;

    stage.addEventListener('wheel', (e) => {
      e.preventDefault();
      zoomBy(e.deltaY > 0 ? 0.9 : 1.1, e.clientX, e.clientY);
    }, { passive: false });
    stage.addEventListener('mousedown', (e) => {
      panning = true;
      panStartX = e.clientX - panX;
      panStartY = e.clientY - panY;
    });
    window.addEventListener('mousemove', (e) => {
      if (!panning) return;
      panX = e.clientX - panStartX;
      panY = e.clientY - panStartY;
      applyTransform();
    });
    window.addEventListener('mouseup', () => { panning = false; });
    stage.addEventListener('dblclick', reset);

    // ---- pin (only when viewer is served from HTTP, not file://) ----
    const WITH_PIN = {{WITH_PIN}};
    if (!WITH_PIN) {
      pinBtn.style.display = 'none';
    }
    let pinned = {{PINNED}};
    function refreshPinUi() {
      pinBtn.classList.toggle('active', pinned);
      pinBtn.textContent = pinned ? 'pinned' : 'pin';
      pinBadge.textContent = pinned ? '★ pinned (long-term)' : '';
      pinBadge.className = pinned ? 'pin-badge' : '';
    }
    pinBtn.onclick = async () => {
      const next = !pinned;
      const resp = await fetch('/pin?id=' + encodeURIComponent(ID) + '&pin=' + next, { method: 'POST' });
      if (resp.ok) { pinned = next; refreshPinUi(); }
    };
    refreshPinUi();

    // ---- copy link ----
    document.getElementById('copy-link').onclick = async () => {
      const url = location.origin + location.pathname + '?id=' + ID;
      try { await navigator.clipboard.writeText(url); document.getElementById('copy-link').textContent = 'copied!'; setTimeout(() => document.getElementById('copy-link').textContent = 'copy link', 1500); } catch {}
    };

    // ---- downloads ----
    document.getElementById('download-svg').onclick = () => {
      const blob = new Blob([svg.outerHTML], { type: 'image/svg+xml' });
      triggerDownload(blob, ID + '.svg');
    };
    document.getElementById('download-png').onclick = () => {
      const xml = new XMLSerializer().serializeToString(svg);
      const svgBlob = new Blob([xml], { type: 'image/svg+xml;charset=utf-8' });
      const url = URL.createObjectURL(svgBlob);
      const img = new Image();
      img.onload = () => {
        const vb = svg.viewBox.baseVal;
        const w = vb && vb.width ? vb.width : svg.clientWidth;
        const h = vb && vb.height ? vb.height : svg.clientHeight;
        const ratio = window.devicePixelRatio || 1;
        const canvas = document.createElement('canvas');
        canvas.width = w * ratio;
        canvas.height = h * ratio;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = 'white';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        canvas.toBlob((blob) => { triggerDownload(blob, ID + '.png'); URL.revokeObjectURL(url); }, 'image/png');
      };
      img.onerror = () => URL.revokeObjectURL(url);
      img.src = url;
    };
    function triggerDownload(blob, name) {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = name;
      a.click();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    // ---- view page can be asked to auto-render to PNG (used by /raw/png 302) ----
    const params = new URLSearchParams(location.search);
    if (params.get('as') === 'png') {
      setTimeout(() => document.getElementById('download-png').click(), 200);
    }

    // ---- theme switcher (M003 S02 T04) ----
    // Inline at end of body, so DOM is parsed; safe to query .theme-btn.
    // Persists the chosen theme in localStorage so the choice survives F5.
    // Defensive try/catch around localStorage so private-mode browsers
    // (Safari ITP, file:// with cookies disabled) don't break the switch.
    const THEME_KEY = 'mermaid-viewer-theme';
    const root = document.documentElement;
    function applyTheme(name) {
      if (!['light','dark','warm','care'].includes(name)) name = 'light';
      root.setAttribute('data-theme', name);
      document.querySelectorAll('.theme-btn').forEach(b =>
        b.toggleAttribute('data-active', b.dataset.theme === name));
      try { localStorage.setItem(THEME_KEY, name); } catch {}
    }
    let saved = 'light';
    try { saved = localStorage.getItem(THEME_KEY) || 'light'; } catch {}
    applyTheme(saved);
    document.querySelectorAll('.theme-btn').forEach(b =>
      b.addEventListener('click', () => applyTheme(b.dataset.theme)));
  </script>
</body>
</html>
