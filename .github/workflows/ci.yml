# GitHub Actions CI for mermaid-tui-mcp.
#
# - Triggers on push and pull_request to the main / master / milestone/* branches
#   (the repo's branching convention is `milestone/<id>`, e.g. `milestone/M001`).
# - Runs the vitest suite on Node 22 and Node 24 in parallel.
# - The coverage report is produced only on Node 24 (the primary version) and
#   uploaded as a workflow artifact. Vitest's built-in `thresholds.lines = 80`
#   check (see vitest.config.mjs) fails the build if coverage drops below the
#   floor, so the threshold is enforced on every push / PR without duplicating
#   the coverage run on both matrix entries.
#
# docs: https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions

name: CI

on:
  push:
    branches: [main, master, 'milestone/*']
  pull_request:
    branches: [main, master, 'milestone/*']

jobs:
  test:
    name: test (node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run test suite
        # Plain `vitest run` (no coverage). The coverage run happens below on
        # node 24 only, where the threshold assertion (vitest.config.mjs) acts
        # as the gate.
        run: npm test

      - name: Run coverage + threshold check
        if: matrix.node-version == 24
        # `vitest run --coverage` triggers the `coverage.thresholds.lines: 80`
        # assertion in vitest.config.mjs. If lines fall below 80%, this step
        # exits non-zero and the build fails.
        run: npm run test:coverage

      - name: Upload coverage report
        if: matrix.node-version == 24
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.node-version }}
          path: coverage/
          if-no-files-found: warn
          retention-days: 14
